<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login — Modjadji Projects</title>

    <link rel="stylesheet" href="./css/admin.css">

</head>

<body>

    <main class="admin-login">

        <div class="login-card">

            <div class="login-header">

                <p class="login-label">
                    MODJADJI PROJECTS
                </p>

                <h1>
                    Admin Login
                </h1>

                <p>
                    Sign in to manage your website.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Admin email"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Sign In
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>

        </div>

    </main>


    <script
        type="module"
        src="./js/login.js"
    ></script>

</body>

</html>
